[package]
name = "eger"
version = "1.1.0"
edition = "2021"
description = "A high-level, parallel ASCII-art media pipeline built on top of iascii: images, video, GIFs, dithering, animated text/banners, and procedural illusions, all rendered to ANSI."
license = "MIT OR Apache-2.0"
# --- Discoverability metadata (crates.io) ---
# crates.io allows at most 5 keywords (<=20 chars each) and at most 5
# categories, and requires them to match its fixed category taxonomy
# (https://crates.io/category_slugs) or `cargo publish` will reject them.
keywords = ["ascii-art", "ansi", "terminal", "dithering", "ffmpeg"]
categories = ["multimedia::images", "multimedia::video", "command-line-utilities", "visualization"]
# Fill these in with your actual repo/homepage before publishing — a
# `repository` link in particular is what crates.io surfaces most
# prominently on a crate's page and is what most people click first.
repository = "https://github.com/Gauravpawar101/eger"
homepage = "https://github.com/Gauravpawar101/eger"
documentation = "https://docs.rs/eger"
readme = "README.md"
authors = ["Gaurav Pawar <gauravpawar2522@gmail.com"]

[lib]
name = "eger"
path = "src/lib.rs"

[dependencies]
iascii = { version = "0.1", features = ["parallel"] }
# NOTE: dependency versions below are pinned tighter than they need to be
# on a modern toolchain. They were pinned to get this crate building and
# its full test+bench suite passing under this container's Rust 1.75
# (rustc/cargo from `apt`, no rustup available). On a normal, current-ish
# Rust install (1.81+) you can safely loosen `rayon`/`rayon-core` back to
# unpinned `"1"`, bump `image` to `"0.25"` (add the `webp` feature back if
# you want it), and drop the dev-dependency pins entirely.
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rayon = "=1.10.0"        # rayon-core 1.13+ needs rustc 1.80+
rayon-core = "=1.12.1"
regex = "1"
thiserror = "1.0"
terminal_size = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "io-std", "fs", "process", "sync", "time", "macros"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
video = ["dep:tokio"]
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
# See the NOTE above `image` — these pins are only needed for rustc 1.75.
criterion = { version = "=0.5.1", features = ["html_reports"] }
tempfile = "=3.14.0"
clap = "=4.4.18"         # transitive, via criterion; clap 4.5+ needs newer rustc
getrandom = "=0.2.15"    # transitive, via tempfile; 0.3+ needs newer rustc
fastrand = "=2.1.1"      # transitive, via tempfile
half = "=2.4.1"          # transitive, via criterion/ciborium; 2.5+ needs newer rustc

[[bench]]
name = "dither_bench"
harness = false

[[bench]]
name = "palette_bench"
harness = false

[[bench]]
name = "colorize_bench"
harness = false

[[bench]]
name = "image_bench"
harness = false

[[bench]]
name = "banner_text_bench"
harness = false

[[bench]]
name = "segment_bench"
harness = false

[[bench]]
name = "illusions_bench"
harness = false

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
